[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrarecon"
version = "1.0.0"
description = "Parallel subdomain enumeration and live-host triage for authorized security recon."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xtawb" }]
keywords = ["bug-bounty", "subdomain-enumeration", "recon", "security", "osint"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/xtawb/ultrarecon"
Issues = "https://github.com/xtawb/ultrarecon/issues"

[project.scripts]
ultrarecon = "ultrarecon.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["ultrarecon*"]
